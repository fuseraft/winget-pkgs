name: Test winget install

on:
  push:
    branches: [test-anchor-manifest]

jobs:
  install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show winget version
        shell: pwsh
        run: winget --version

      - name: Validate manifest
        shell: pwsh
        run: winget validate --manifest manifest --ignore-warnings

      - name: Install from manifest
        shell: pwsh
        run: |
          winget settings --enable LocalManifestFiles
          winget install --manifest manifest --accept-source-agreements --accept-package-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run anchor through its alias
        shell: pwsh
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          Get-Command anchor | Format-List Source
          anchor --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: List and uninstall
        shell: pwsh
        run: |
          winget list --id Fuseraft.Anchor --exact --accept-source-agreements --disable-interactivity
          winget uninstall --id Fuseraft.Anchor --exact --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
